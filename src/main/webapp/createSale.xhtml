<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:p="primefaces">
<h:head>
	<title>MarketJSF - Eskaintza sortu</title>
</h:head>
<h:body>
	<h:form enctype="multipart/form-data">
		<table>
			<tr>
				<td>Tituloa</td>
				<td><h:inputText value="#{createSale.title}" /></td>
			</tr>
			<tr>
				<td>Deskripzioa</td>
				<td><h:inputTextarea value="#{createSale.description}" /></td>
			</tr>
			<tr>
				<td>Egoera</td>
				<td><h:selectOneMenu value="#{createSale.status}" var="s"
						itemValue="#{s.code}" itemLabel="#{s.status}">
						<f:selectItems value="#{createSale.statusList}" />
					</h:selectOneMenu></td>
			</tr>
			<tr>
				<td>Argazkia</td>
				<td><h:inputFile value="#{createSale.image}" /></td>
			</tr>
			<tr>
				<td>Argitarapen eguna</td>
				<td><p:datePicker monthNavigator="true" yearNavigator="true"
						inline="true" value="#{createSale.pubDate}" /></td>
			</tr>
			<tr>
				<td>Prezioa</td>
				<td><h:inputText value="#{createSale.price}" /></td>
			</tr>
		</table>
		<p>
			<h:commandButton value="Sortu Eskaintza"
				action="#{createSale.createSale()}" />
			<h:commandButton value="Itxi" action="main.xhtml" immediate="true" />
		</p>
		<h:messages style="color:red" />
	</h:form>
</h:body>
</html>
